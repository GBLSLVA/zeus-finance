services:
  - type: web
    name: zeus-finance
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
