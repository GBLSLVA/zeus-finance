name: Container

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/gblslva/zeus-finance

jobs:
  container-smoke:
    name: Build and smoke test container
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --pull --tag zeus-finance:ci .

      - name: Start container
        shell: bash
        run: |
          docker run -d \
            --name zeus-finance-ci \
            -p 10000:10000 \
            -e NODE_ENV=production \
            -e PORT=10000 \
            -e ALLOW_SQLITE_PRODUCTION=1 \
            -e APP_ORIGIN=same-origin \
            -e APP_BASE_URL=http://127.0.0.1:10000 \
            zeus-finance:ci

      - name: Verify healthcheck and frontend
        shell: bash
        run: |
          cleanup() {
            docker logs zeus-finance-ci || true
            docker rm -f zeus-finance-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:10000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"database":"sqlite"' /tmp/health.json
          grep -q '"persistent":false' /tmp/health.json
          curl -fsS http://127.0.0.1:10000/ | grep -q '<div id="root"></div>'

      - name: Inspect container health
        shell: bash
        run: |
          for attempt in {1..12}; do
            STATUS="$(docker inspect --format='{{.State.Health.Status}}' zeus-finance-ci)"
            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              docker inspect zeus-finance-ci
              exit 1
            fi
            sleep 5
          done
          docker inspect zeus-finance-ci
          exit 1

  publish:
    name: Publish GHCR image
    needs: container-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
